name: Animated Bangla Podcast — Code Generated Character

# ================================================================
# ONLY USER FILES REQUIRED
#   1) audio.mp3
#   2) timestamps.txt
#
# Everything else is generated by this workflow:
#   - character design
#   - face / hair / beard
#   - shirt / pants / shoes
#   - eyes / expressions
#   - mouth / visemes
#   - blinking
#   - head movement
#   - right/left/both hand gestures
#   - salute / salam / wave / raise
#   - studio background
#   - desk / microphone / coffee / bookshelf / neon sign
#   - audio visualizer
#   - subtitles
#   - calibration / diagnostic previews
#
# BACKWARD-COMPATIBLE timestamps.txt:
#   start | end | dialogue | expression
#
# EXTENDED FORMAT:
#   start | end | dialogue | expression | gesture | intensity | camera | notes
#
# gesture examples:
#   none
#   right:raise / left:raise / both:raise
#   right:salute / left:salute
#   right:salam / left:salam
#   right:wave / left:wave / both:wave
#   nod / bow
#   auto
#
# "auto" can infer a gesture from dialogue keywords.
# Character-right means the character's right hand.
# ================================================================

on:
  workflow_dispatch:
    # GitHub Actions supports at most 10 workflow_dispatch inputs.
    # Related settings are grouped as JSON so all settings remain editable
    # from the Run workflow UI without exceeding that platform limit.
    inputs:
      audio_file:
        description: "Required audio filename"
        required: true
        default: "audio.mp3"
      timestamps_file:
        description: "Required timestamp filename"
        required: true
        default: "timestamps.txt"
      video_config:
        description: "JSON: width, height, fps"
        required: true
        default: '{"width":1280,"height":720,"fps":30}'
      character_config:
        description: "JSON: gender, skin, hair, beard, shirt, pants, shoes, scale, position"
        required: true
        default: '{"gender":"male","skin_tone":"warm_brown","hair_style":"short","beard_style":"trimmed","shirt_style":"striped","shirt_color":"white_blue","pants_color":"charcoal","shoe_color":"black","body_scale":1.0,"character_x":640,"character_bottom":690}'
      animation_config:
        description: "JSON: auto gesture, smoothing, arm angle, blink, head motion, lip sync"
        required: true
        default: '{"auto_gesture":true,"gesture_smooth":0.20,"gesture_max_deg":68,"blink_min":2.5,"blink_max":5.5,"head_motion":1.0,"lip_sync":"hybrid"}'
      camera_config:
        description: "JSON: camera style and strength"
        required: true
        default: '{"style":"gentle","strength":1.0}'
      studio_config:
        description: "JSON: podcast title, episode, theme"
        required: true
        default: '{"podcast_name":"আমার পডকাস্ট","episode":"পর্ব ০১ | স্বাগতম","theme":"warm_wood"}'
      display_config:
        description: "JSON: subtitles and visualizer"
        required: true
        default: '{"subtitle_enabled":true,"visualizer_enabled":true}'
      render_config:
        description: "JSON: preview_only"
        required: true
        default: '{"preview_only":false}'
      notes:
        description: "Optional free-form notes; does not affect rendering"
        required: false
        default: ""

env:
  AUDIO_FILE: ${{ github.event.inputs.audio_file }}
  TIMESTAMPS_FILE: ${{ github.event.inputs.timestamps_file }}
  VIDEO_CONFIG: ${{ github.event.inputs.video_config }}
  CHARACTER_CONFIG: ${{ github.event.inputs.character_config }}
  ANIMATION_CONFIG: ${{ github.event.inputs.animation_config }}
  CAMERA_CONFIG: ${{ github.event.inputs.camera_config }}
  STUDIO_CONFIG: ${{ github.event.inputs.studio_config }}
  DISPLAY_CONFIG: ${{ github.event.inputs.display_config }}
  RENDER_CONFIG: ${{ github.event.inputs.render_config }}

jobs:
  animate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-noto-core fonts-dejavu-core
          python -m pip install --upgrade --no-cache-dir \
            pillow numpy opencv-python-headless==4.10.0.84 fonttools

      - name: Download Rhubarb Lip Sync
        run: |
          curl -sL -o rhubarb.zip \
            https://github.com/DanielSWolf/rhubarb-lip-sync/releases/download/v1.13.0/Rhubarb-Lip-Sync-1.13.0-Linux.zip
          unzip -q rhubarb.zip

      - name: Render — all graphics generated by code
        run: |
          cat > podcast.py <<'PYEOF'
          import os, re, json, math, wave, random, shutil, subprocess, glob
          from pathlib import Path
          import numpy as np
          import cv2
          from PIL import Image, ImageDraw, ImageFont
          from fontTools.ttLib import TTFont

          # ============================================================
          # 0) CONFIG
          # ============================================================
          def _json_env(name, default):
              raw = os.getenv(name, "").strip()
              if not raw:
                  return default
              try:
                  value = json.loads(raw)
                  if not isinstance(value, dict):
                      raise ValueError("must be a JSON object")
                  return value
              except Exception as exc:
                  raise RuntimeError(f"Invalid {name} JSON: {exc}. Edit the corresponding Run workflow field.") from exc

          VIDEO = _json_env("VIDEO_CONFIG", {"width":1280,"height":720,"fps":30})
          CHARACTER = _json_env("CHARACTER_CONFIG", {
              "gender":"male","skin_tone":"warm_brown","hair_style":"short","beard_style":"trimmed",
              "shirt_style":"striped","shirt_color":"white_blue","pants_color":"charcoal","shoe_color":"black",
              "body_scale":1.0,"character_x":640,"character_bottom":690
          })
          ANIMATION = _json_env("ANIMATION_CONFIG", {
              "auto_gesture":True,"gesture_smooth":0.20,"gesture_max_deg":68,"blink_min":2.5,
              "blink_max":5.5,"head_motion":1.0,"lip_sync":"hybrid"
          })
          CAMERA = _json_env("CAMERA_CONFIG", {"style":"gentle","strength":1.0})
          STUDIO = _json_env("STUDIO_CONFIG", {"podcast_name":"আমার পডকাস্ট","episode":"পর্ব ০১ | স্বাগতম","theme":"warm_wood"})
          DISPLAY = _json_env("DISPLAY_CONFIG", {"subtitle_enabled":True,"visualizer_enabled":True})
          RENDER = _json_env("RENDER_CONFIG", {"preview_only":False})

          W = int(VIDEO.get("width",1280))
          H = int(VIDEO.get("height",720))
          FPS = int(VIDEO.get("fps",30))
          AUDIO = os.getenv("AUDIO_FILE","audio.mp3")
          TS_FILE = os.getenv("TIMESTAMPS_FILE","timestamps.txt")
          PREVIEW_ONLY = bool(RENDER.get("preview_only",False))

          PODCAST_NAME = str(STUDIO.get("podcast_name","আমার পডকাস্ট"))
          EPISODE = str(STUDIO.get("episode","পর্ব ০১ | স্বাগতম"))

          CHARACTER_GENDER = str(CHARACTER.get("gender","male"))
          SKIN_TONE = str(CHARACTER.get("skin_tone","warm_brown"))
          HAIR_STYLE = str(CHARACTER.get("hair_style","short"))
          BEARD_STYLE = str(CHARACTER.get("beard_style","trimmed"))
          SHIRT_STYLE = str(CHARACTER.get("shirt_style","striped"))
          SHIRT_COLOR = str(CHARACTER.get("shirt_color","white_blue"))
          PANTS_COLOR = str(CHARACTER.get("pants_color","charcoal"))
          SHOE_COLOR = str(CHARACTER.get("shoe_color","black"))
          BODY_SCALE = float(CHARACTER.get("body_scale",1.0))
          CHARACTER_X = float(CHARACTER.get("character_x",640))
          CHARACTER_BOTTOM = float(CHARACTER.get("character_bottom",690))

          AUTO_GESTURE = bool(ANIMATION.get("auto_gesture",True))
          GESTURE_SMOOTH = float(ANIMATION.get("gesture_smooth",0.20))
          GESTURE_MAX_DEG = float(ANIMATION.get("gesture_max_deg",68))
          BLINK_MIN = float(ANIMATION.get("blink_min",2.5))
          BLINK_MAX = float(ANIMATION.get("blink_max",5.5))
          HEAD_MOTION = float(ANIMATION.get("head_motion",1.0))
          LIP_SYNC = str(ANIMATION.get("lip_sync","hybrid"))
          CAMERA_STYLE = str(CAMERA.get("style","gentle"))
          CAMERA_STRENGTH = float(CAMERA.get("strength",1.0))
          STUDIO_THEME = str(STUDIO.get("theme","warm_wood"))
          SUBTITLE_ENABLED = bool(DISPLAY.get("subtitle_enabled",True))
          VISUALIZER_ENABLED = bool(DISPLAY.get("visualizer_enabled",True))

          # ============================================================
          # 1) VALIDATION
          # ============================================================
          if not os.path.exists(AUDIO):
              raise RuntimeError(f"Missing required file: {AUDIO}")
          if not os.path.exists(TS_FILE):
              raise RuntimeError(f"Missing required file: {TS_FILE}")

          def run(cmd, check=True):
              print("$", " ".join(map(str,cmd)))
              return subprocess.run(cmd, check=check, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True)

          def duration(path):
              r=run(["ffprobe","-v","error","-show_entries","format=duration",
                     "-of","default=noprint_wrappers=1:nokey=1",path])
              return float(r.stdout.strip())

          DURATION = duration(AUDIO)

          # ============================================================
          # 2) TIMESTAMP PARSER — OLD + EXTENDED FORMAT
          # ============================================================
          def parse_ts(path):
              rows=[]
              for raw in open(path,encoding="utf-8-sig"):
                  s=raw.strip()
                  if not s or s.startswith("#"): continue
                  p=[x.strip() for x in s.split("|")]
                  if len(p)<3: continue
                  try:
                      st=float(p[0]); en=float(p[1])
                  except:
                      continue
                  text=p[2]
                  expr=(p[3] if len(p)>3 and p[3] else "neutral").strip().lower()
                  gesture=(p[4] if len(p)>4 and p[4] else "none").strip().lower()
                  intensity=float(p[5]) if len(p)>5 and p[5] else 1.0
                  camera=(p[6] if len(p)>6 and p[6] else "default").strip().lower()
                  notes=(p[7] if len(p)>7 else "").strip()
                  rows.append({
                      "start":max(0,st),"end":min(DURATION,max(st,en)),
                      "text":text,"expression":expr or "neutral",
                      "gesture":gesture or "none",
                      "intensity":max(0,min(1.5,intensity)),
                      "camera":camera or "default","notes":notes
                  })
              rows.sort(key=lambda x:x["start"])
              return rows

          segments=parse_ts(TS_FILE)
          if not segments:
              segments=[{"start":0,"end":DURATION,"text":"","expression":"neutral",
                         "gesture":"none","intensity":1.0,"camera":"default","notes":""}]

          def active_segment(t):
              for s in segments:
                  if s["start"] <= t < s["end"]: return s
              return segments[-1] if segments else None

          # ============================================================
          # 3) OPTIONAL RHUBARB LIP SYNC — NO IMAGE ASSETS NEEDED
          # ============================================================
          mouth_cues=[]
          rhubarb = None
          for p in glob.glob("**/rhubarb",recursive=True):
              if os.path.isfile(p) and os.access(p,os.X_OK):
                  rhubarb=p; break

          if LIP_SYNC in ("rhubarb","hybrid") and rhubarb:
              try:
                  subprocess.run([rhubarb,"-f","json","-r","phonetic","-o","mouth.json",AUDIO],
                                 check=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE)
                  dat=json.load(open("mouth.json",encoding="utf-8"))
                  mouth_cues=dat.get("mouthCues",[])
                  print("Rhubarb mouth cues:",len(mouth_cues))
              except Exception as e:
                  print("Rhubarb unavailable; using generated audio/timestamp mouth motion:",e)

          def mouth_shape(t, seg):
              # Rhubarb -> generated vector mouth shape.
              for c in mouth_cues:
                  if c["start"] <= t < c["end"]:
                      return str(c.get("value","X")).upper()
              # Deterministic fallback. The mouth still moves with the speech segment.
              if not seg: return "REST"
              phase=int(max(0,(t-seg["start"]))*11)%8
              return ["REST","A","E","I","O","U","M","L"][phase]

          # ============================================================
          # 4) FONTS
          # ============================================================
          def font(size,bold=False):
              candidates=[
                  "/usr/share/fonts/truetype/noto/NotoSansBengali-Bold.ttf" if bold
                  else "/usr/share/fonts/truetype/noto/NotoSansBengali-Regular.ttf",
                  "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf" if bold
                  else "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"
              ]
              for p in candidates:
                  if os.path.exists(p):
                      try: return ImageFont.truetype(p,size)
                      except: pass
              return ImageFont.load_default()

          FB=font(24,True); FS=font(22,False); FT=font(18,True)

          # ============================================================
          # 5) COLOR PALETTE
          # ============================================================
          SKINS={
              "warm_brown":(188,125,82),
              "brown":(165,104,68),
              "light_brown":(207,151,105)
          }
          skin=SKINS.get(SKIN_TONE,SKINS["warm_brown"])
          skin_hi=tuple(min(255,int(v*1.10)) for v in skin)
          skin_sh=tuple(max(0,int(v*0.78)) for v in skin)

          HAIR=(28,27,31)
          HAIR_HI=(50,48,53)
          BEARD=(37,35,39)
          SHIRT=(236,243,244)
          SHIRT_BLUE=(123,193,215)
          PANTS=(38,43,51)
          SHOE=(25,27,31)
          WHITE=(250,250,250)
          BLACK=(20,20,23)
          IRIS=(67,48,37)

          # ============================================================
          # 6) VECTOR CHARACTER — COMPLETELY GENERATED BY CODE
          # ============================================================
          #
          # Coordinate system is local character canvas:
          #   width  = 420
          #   height = 650
          #
          # The character is intentionally built from vector-like primitives.
          # There is no body.jpg, expressions.jpg or visemes.jpg dependency.
          # ============================================================

          CW,CH=420,650

          def rr(draw,box,r,fill,outline=None,width=1):
              draw.rounded_rectangle(tuple(int(x) for x in box),radius=int(r),fill=fill,outline=outline,width=width)

          def poly(draw,pts,fill):
              draw.polygon([(int(x),int(y)) for x,y in pts],fill=fill)

          def ellipse(draw,box,fill,outline=None,width=1):
              draw.ellipse(tuple(int(x) for x in box),fill=fill,outline=outline,width=width)

          def line(draw,pts,fill,width=1):
              draw.line([(int(x),int(y)) for x,y in pts],fill=fill,width=max(1,int(width)),joint="curve")

          def rotate_layer(layer,deg,resample=Image.Resampling.BICUBIC):
              return layer.rotate(float(deg),resample=resample,expand=True)

          def paste_center(base,layer,cx,cy,alpha=None):
              x=int(cx-layer.width/2); y=int(cy-layer.height/2)
              if alpha is None: base.alpha_composite(layer,(x,y))
              else: base.alpha_composite(layer,(x,y),dest=(x,y))

          def draw_eye(draw,cx,cy,open_amt=1.0,ang=0.0):
              # Eye is generated as a compact vector object.
              ew,eh=44,22
              if open_amt<0.20:
                  line(draw,[(cx-ew/2,cy),(cx+ew/2,cy)],BLACK,4)
                  return
              hh=max(3,int(eh*open_amt))
              ellipse(draw,(cx-ew/2,cy-hh/2,cx+ew/2,cy+hh/2),WHITE)
              ellipse(draw,(cx-8,cy-hh*.36,cx+8,cy+hh*.36),IRIS)
              ellipse(draw,(cx-3,cy-hh*.25,cx+3,cy+hh*.10),BLACK)
              ellipse(draw,(cx-1,cy-hh*.20,cx+3,cy-hh*.02),WHITE)
              line(draw,[(cx-ew/2,cy-hh/2-2),(cx,cy-hh/2-5),(cx+ew/2,cy-hh/2-2)],BLACK,4)

          def draw_mouth(draw,cx,cy,shape,emotion="neutral"):
              shape=shape.upper()
              # Crucial: one vector mouth only. Beard is drawn around it and never
              # comes from a second mouth image, preventing double lips/beard.
              widths={"REST":44,"A":34,"E":42,"I":25,"O":30,"U":29,"M":40,"F":40,"L":36}
              w=widths.get(shape,34)
              if shape=="REST":
                  line(draw,[(cx-w/2,cy),(cx+w/2,cy)],(72,45,40),3)
                  return
              if shape=="A":
                  rr(draw,(cx-w/2,cy-7,cx+w/2,cy+13),9,(58,32,31),outline=(46,28,28),width=2)
                  ellipse(draw,(cx-7,cy-2,cx+7,cy+5), (205,116,105))
              elif shape=="E":
                  rr(draw,(cx-w/2,cy-7,cx+w/2,cy+6),5,WHITE,outline=(60,42,40),width=2)
              elif shape=="I":
                  rr(draw,(cx-w/2,cy-3,cx+w/2,cy+5),5,(73,42,40),outline=(52,35,34),width=2)
              elif shape=="O":
                  ellipse(draw,(cx-w/2,cy-13,cx+w/2,cy+15),(59,32,31),outline=(45,28,27),width=2)
                  ellipse(draw,(cx-7,cy-4,cx+7,cy+7),(207,120,110))
              elif shape=="U":
                  ellipse(draw,(cx-w/2,cy-8,cx+w/2,cy+9),(63,35,34),outline=(46,29,28),width=2)
                  ellipse(draw,(cx-6,cy-2,cx+6,cy+5),(199,110,105))
              elif shape=="M":
                  line(draw,[(cx-w/2,cy+1),(cx-w*.18,cy-1),(cx+w*.18,cy-1),(cx+w/2,cy+1)],(64,37,35),4)
              elif shape=="F":
                  rr(draw,(cx-w/2,cy-6,cx+w/2,cy+5),5,WHITE,outline=(55,39,37),width=2)
                  line(draw,[(cx-w*.30,cy+5),(cx-w*.18,cy+12),(cx+w*.18,cy+12),(cx+w*.30,cy+5)],(57,36,34),2)
              elif shape=="L":
                  ellipse(draw,(cx-w/2,cy-10,cx+w/2,cy+11),(62,34,33))
                  ellipse(draw,(cx-10,cy-2,cx+10,cy+6),(211,122,113))
              else:
                  line(draw,[(cx-w/2,cy),(cx+w/2,cy)],(72,45,40),3)

          def draw_character(t,seg,gesture_state):
              im=Image.new("RGBA",(CW,CH),(0,0,0,0))
              d=ImageDraw.Draw(im)

              expr=(seg.get("expression","neutral") if seg else "neutral").lower()
              if expr in ("respectful","calm","informative","neutral"): expr="neutral"
              if expr not in ("neutral","happy","angry","surprised","sad","sleepy"): expr="neutral"

              # body
              # legs
              rr(d,(155,445,207,595),12,PANTS)
              rr(d,(213,445,265,595),12,PANTS)
              # shoes
              rr(d,(142,575,213,623),18,SHOE)
              rr(d,(207,575,278,623),18,SHOE)
              line(d,[(150,607),(207,607)],(55,58,65),3)
              line(d,[(213,607),(272,607)],(55,58,65),3)

              # torso/shirt
              poly(d,[(125,245),(160,220),(260,220),(295,245),(286,465),(134,465)],SHIRT)
              # shirt shadow
              poly(d,[(134,465),(155,448),(170,470),(250,470),(270,448),(286,465)],(218,225,228))
              # collar
              poly(d,[(160,220),(207,250),(188,278),(148,238)],(224,235,238))
              poly(d,[(260,220),(207,250),(226,278),(272,238)],(224,235,238))
              # center seam
              line(d,[(207,250),(207,464)],(150,165,170),2)
              # buttons
              for yy in [280,320,360,400,440]:
                  ellipse(d,(202,yy-4,210,yy+4),WHITE,outline=(100,110,115),width=1)
              # stripes
              if SHIRT_STYLE=="striped":
                  for xx in range(150,275,20):
                      line(d,[(xx,255),(xx,455)],SHIRT_BLUE,2)
              # pocket
              rr(d,(232,315,270,350),4,None if False else (235,241,242),outline=(170,180,185),width=1)

              # arms
              # base arm positions
              rg=gesture_state.get("right_angle",0.0)
              lg=gesture_state.get("left_angle",0.0)
              rlayer=Image.new("RGBA",(145,260),(0,0,0,0)); rd=ImageDraw.Draw(rlayer)
              rr(rd,(48,20,102,215),22,SHIRT)
              rr(rd,(58,190,105,245),12,skin)
              if SHIRT_STYLE=="striped":
                  for xx in range(57,101,17): line(rd,[(xx,30),(xx,185)],SHIRT_BLUE,2)
              rlayer=rotate_layer(rlayer,rg)
              im.alpha_composite(rlayer,(48-int((rlayer.width-145)/2),240-int((rlayer.height-260)/2)))

              llayer=Image.new("RGBA",(145,260),(0,0,0,0)); ld=ImageDraw.Draw(llayer)
              rr(ld,(43,20,97,215),22,SHIRT)
              rr(ld,(40,190,87,245),12,skin)
              if SHIRT_STYLE=="striped":
                  for xx in range(42,86,17): line(ld,[(xx,30),(xx,185)],SHIRT_BLUE,2)
              llayer=rotate_layer(llayer,-lg)
              im.alpha_composite(llayer,(227-int((llayer.width-145)/2),240-int((llayer.height-260)/2)))

              # neck
              rr(d,(181,195,233,245),12,skin)
              # ears
              ellipse(d,(105,130,138,185),skin)
              ellipse(d,(277,130,310,185),skin)

              # head
              ellipse(d,(132,55,282,220),skin)
              # face shading
              poly(d,[(207,65),(274,105),(265,190),(230,214),(207,214)],skin_sh)

              # hair
              if HAIR_STYLE in ("short","neat","side"):
                  poly(d,[(130,118),(136,80),(155,52),(192,34),(236,39),(274,58),(288,99),
                          (273,113),(260,87),(242,100),(216,76),(190,96),(165,84),(150,116)],HAIR)
                  line(d,[(145,73),(175,54),(210,47),(245,52)],HAIR_HI,3)
                  if HAIR_STYLE=="side":
                      line(d,[(220,48),(255,78)],HAIR_HI,3)

              # eyebrows / eyes
              brow_y=123
              eye_open=1.0
              if expr=="sleepy": eye_open=.35
              if expr=="surprised": eye_open=1.35
              if gesture_state.get("blink",False): eye_open=.08

              brow_delta=0
              if expr=="angry": brow_delta=10
              if expr=="happy": brow_delta=-3
              line(d,[(155,brow_y+brow_delta),(188,brow_y-6+brow_delta)],BLACK,6)
              line(d,[(226,brow_y-6+brow_delta),(259,brow_y+brow_delta)],BLACK,6)
              draw_eye(d,171,145,eye_open)
              draw_eye(d,243,145,eye_open)

              # nose
              line(d,[(207,145),(202,174),(214,178)],skin_sh,3)

              # beard — drawn ONCE, around the vector mouth.
              if BEARD_STYLE!="none":
                  # side beard and chin, deliberately leaving mouth clear
                  poly(d,[(145,169),(151,202),(174,220),(207,232),(240,220),(263,202),(269,169),
                          (255,190),(239,207),(207,214),(175,207),(159,190)],BEARD)
                  # beard highlight/stubble
                  for xx in range(165,251,9):
                      line(d,[(xx,193),(xx-3,207)],(64,61,66),1)

              # expression-specific mouth/face
              mouth_y=192
              if expr=="happy":
                  mouth_y=190
              elif expr=="surprised":
                  mouth_y=193
              elif expr=="angry":
                  mouth_y=194

              shape=mouth_shape(t,seg)
              if expr=="surprised" and shape=="REST": shape="O"
              draw_mouth(d,207,mouth_y,shape,expr)

              # beard trim line below mouth, never overlapping mouth itself
              if BEARD_STYLE=="trimmed":
                  line(d,[(183,213),(207,218),(231,213)],(67,63,68),2)

              return im

          # ============================================================
          # 7) GESTURE ENGINE
          # ============================================================
          AUTO_KEYWORDS={
              "right:salute":[r"সালাম",r"সালুট",r"আসসালাম",r"শ্রদ্ধা"],
              "right:raise":[r"উঠ",r"উত্থান",r"হাত তুল",r"উঠান"],
              "right:wave":[r"বিদায়",r"স্বাগতম",r"ওয়েভ",r"হাত নাড়"],
              "right:salam":[r"সালাম",r"আসসালামু"],
              "nod":[r"হ্যাঁ",r"ঠিক",r"নিশ্চয়",r"অবশ্যই"],
              "bow":[r"দুঃখিত",r"ক্ষমা",r"সম্মান"]
          }

          def infer_gesture(text):
              if not AUTO_GESTURE: return "none"
              for g,patterns in AUTO_KEYWORDS.items():
                  for p in patterns:
                      if re.search(p,text,re.I): return g
              return "none"

          def resolve_gesture(seg):
              g=seg.get("gesture","none")
              if g=="auto": return infer_gesture(seg.get("text",""))
              if g and g!="none": return g
              return infer_gesture(seg.get("text","")) if AUTO_GESTURE else "none"

          def smoothstep(x):
              x=max(0,min(1,x)); return x*x*(3-2*x)

          def gesture_state(t,seg):
              action=resolve_gesture(seg)
              intensity=float(seg.get("intensity",1.0))
              st=seg["start"]; en=max(st+0.01,seg["end"])
              p=(t-st)/(en-st)
              # smooth entrance/exit
              edge=min(1,p/0.18,(1-p)/0.18)
              amp=smoothstep(max(0,edge))*intensity
              rs=0.0; ls=0.0
              if action.startswith("right:"): rs=1
              if action.startswith("left:"): ls=1
              if action.startswith("both:"): rs=ls=1

              verb=action.split(":",1)[1] if ":" in action else action
              target=GESTURE_MAX_DEG*amp

              if verb=="raise": rs*=target; ls*=target
              elif verb in ("salute","salam"): rs*=target*.78; ls*=target*.78
              elif verb=="wave":
                  rs*=target*.60; ls*=target*.60
              elif verb=="none": rs=ls=0

              # subtle breathing/rest motion
              rest=math.sin(t*1.8)*0.7*HEAD_MOTION
              return {
                  "right_angle":rs,"left_angle":ls,
                  "blink":False,"rest":rest,
                  "action":action
              }

          # ============================================================
          # 8) BLINK + HEAD MOTION
          # ============================================================
          def blink_at(t):
              # Deterministic natural blink schedule.
              x=2.9
              while x<t:
                  if abs(t-x)<0.10: return True
                  x += BLINK_MIN + (math.sin(x*1.73)+1)/2*(BLINK_MAX-BLINK_MIN)
              return False

          # ============================================================
          # 9) CODE-GENERATED STUDIO
          # ============================================================
          def studio_frame(t,seg,character):
              frame=np.zeros((H,W,3),np.uint8)

              if STUDIO_THEME=="dark_blue":
                  top=(20,28,45); bottom=(10,15,28)
              elif STUDIO_THEME=="neutral":
                  top=(62,62,66); bottom=(35,35,39)
              else:
                  top=(62,42,34); bottom=(28,20,18)

              for y in range(H):
                  q=y/max(1,H-1)
                  frame[y,:,0]=int(top[0]*(1-q)+bottom[0]*q)
                  frame[y,:,1]=int(top[1]*(1-q)+bottom[1]*q)
                  frame[y,:,2]=int(top[2]*(1-q)+bottom[2]*q)

              # wood wall
              for x in range(300,980,26):
                  cv2.rectangle(frame,(x,0),(x+18,600),(96,64,46),-1)
                  cv2.line(frame,(x+19,0),(x+19,600),(55,39,33),4)

              # shelves
              cv2.rectangle(frame,(10,110),(275,610),(31,25,25),-1)
              for sy in [225,350,475,600]:
                  cv2.rectangle(frame,(20,sy),(265,sy+8),(117,78,52),-1)
              book_colors=[(65,105,150),(150,70,70),(195,155,60),(80,130,95),(135,85,150),(210,110,60)]
              rng=random.Random(9)
              for row,sy in enumerate([220,345,470,595]):
                  x=30
                  while x<250:
                      bw=rng.randint(13,25); bh=rng.randint(50,92)
                      cv2.rectangle(frame,(x,sy-bh),(x+bw,sy),rng.choice(book_colors),-1)
                      x+=bw+3

              # plant
              cv2.rectangle(frame,(45,75),(90,110),(205,205,198),-1)
              for ang in [-55,-25,0,25,55]:
                  ex=68+int(25*math.sin(math.radians(ang)))
                  ey=72-int(35*math.cos(math.radians(ang)))
                  cv2.line(frame,(68,85),(ex,ey),(65,150,85),4)
                  cv2.circle(frame,(ex,ey),8,(70,170,95),-1)

              # neon title
              cv2.rectangle(frame,(1010,70),(1250,155),(22,18,30),-1)
              cv2.rectangle(frame,(1010,70),(1250,155),(245,70,210),3)
              cv2.putText(frame,PODCAST_NAME[:22],(1028,118),cv2.FONT_HERSHEY_SIMPLEX,.9,(250,220,250),2,cv2.LINE_AA)

              # art frame
              cv2.rectangle(frame,(1030,25),(1110,75),(30,27,28),-1)
              cv2.rectangle(frame,(1030,25),(1110,75),(205,175,110),2)

              # ON AIR
              cv2.rectangle(frame,(1110,520),(1245,565),(80,30,35),-1)
              cv2.rectangle(frame,(1110,520),(1245,565),(255,110,110),2)
              cv2.putText(frame,"ON AIR",(1135,551),cv2.FONT_HERSHEY_SIMPLEX,.65,(255,235,235),2,cv2.LINE_AA)

              # desk
              cv2.rectangle(frame,(0,590),(W,720),(119,76,45),-1)
              cv2.rectangle(frame,(0,590),(W,600),(176,118,70),-1)

              # microphone
              cv2.ellipse(frame,(280,500),(22,55),15,0,360,(42,45,52),-1)
              cv2.line(frame,(298,548),(280,590),(28,30,34),7)
              cv2.line(frame,(280,590),(245,600),(28,30,34),7)
              cv2.line(frame,(280,590),(315,600),(28,30,34),7)
              cv2.line(frame,(267,530),(310,548),(205,55,45),4)

              # coffee
              cv2.rectangle(frame,(470,548),(520,590),(240,235,220),-1)
              cv2.ellipse(frame,(505,557),(22,18),0,270,90,(240,235,220),4)
              for k in range(3):
                  cv2.ellipse(frame,(482+k*8,535),(3,14),0,0,180,(205,205,205),2)

              # audio visualizer
              if VISUALIZER_ENABLED:
                  cv2.rectangle(frame,(1005,180),(1250,330),(16,18,31),-1)
                  cv2.rectangle(frame,(1005,180),(1250,330),(100,100,130),2)
                  # deterministic pseudo live bars
                  for i in range(22):
                      amp=.25+.75*(.5+.5*math.sin(t*7+i*.71))
                      bh=int(25+80*amp)
                      x=1015+i*10
                      cv2.rectangle(frame,(x,305-bh),(x+6,305),(80,190,235),-1)

              # episode tag
              cv2.rectangle(frame,(15,18),(250,60),(40,130,75),-1)
              cv2.putText(frame,EPISODE[:28],(28,46),cv2.FONT_HERSHEY_SIMPLEX,.52,(255,255,255),2,cv2.LINE_AA)

              # subtitle
              if SUBTITLE_ENABLED and seg and seg.get("text"):
                  text=seg["text"]
                  overlay=frame.copy()
                  cv2.rectangle(overlay,(65,650),(1215,705),(10,8,12),-1)
                  frame=cv2.addWeighted(overlay,.88,frame,.12,0)
                  # PIL handles Bangla text.
                  pim=Image.fromarray(cv2.cvtColor(frame,cv2.COLOR_BGR2RGB))
                  pd=ImageDraw.Draw(pim)
                  f=font(22,True)
                  # simple center fit
                  maxw=1080
                  if f.getlength(text)>maxw:
                      while f.size>12 and f.getlength(text)>maxw:
                          f=font(f.size-1,True)
                  tw=f.getlength(text)
                  pd.text(((W-tw)/2,665),text,font=f,fill=(255,255,255))
                  frame=cv2.cvtColor(np.array(pim),cv2.COLOR_RGB2BGR)

              # character compositing
              ch=character
              scale=BODY_SCALE*1.0
              nw=int(ch.width*scale); nh=int(ch.height*scale)
              ch=ch.resize((nw,nh),Image.Resampling.LANCZOS)

              # natural camera / head-level drift
              camx=0; camy=0
              if CAMERA_STYLE!="static":
                  camx=int(math.sin(t*.35)*3*CAMERA_STRENGTH)
                  camy=int(math.sin(t*.28+1.2)*2*CAMERA_STRENGTH)

              x=int(CHARACTER_X+camx-nw/2)
              y=int(CHARACTER_BOTTOM+camy-nh)
              pim=Image.fromarray(cv2.cvtColor(frame,cv2.COLOR_BGR2RGB)).convert("RGBA")
              pim.alpha_composite(ch,(x,y))
              return cv2.cvtColor(np.array(pim.convert("RGB")),cv2.COLOR_RGB2BGR)

          # ============================================================
          # 10) GENERATED CHARACTER PREVIEW
          # ============================================================
          preview=Image.new("RGBA",(900,700),(245,245,245,255))
          cp=draw_character(0,{"start":0,"end":1,"expression":"neutral","text":"","gesture":"none","intensity":1.0}, {"right_angle":0,"left_angle":0,"blink":False,"rest":0})
          cp=cp.resize((420,650),Image.Resampling.LANCZOS)
          preview.alpha_composite(Image.fromarray(cv2.cvtColor(cp,cv2.COLOR_BGR2RGBA)),(40,25))
          pd=ImageDraw.Draw(preview)
          pd.text((500,50),"CODE-GENERATED CHARACTER",font=font(30,True),fill=(25,25,30))
          info=[
              "No body.jpg",
              "No expressions.jpg",
              "No visemes.jpg",
              "Vector-style face, body and clothing",
              "Generated eyes + expressions",
              "Generated mouth / lip-sync shapes",
              "Generated arms + gestures",
              "Generated studio background"
          ]
          for i,s in enumerate(info):
              pd.text((500,105+i*42),s,font=font(22,False),fill=(45,45,50))
          preview.convert("RGB").save(PREVIEW)

          report={
              "required_user_files":[AUDIO,TS_FILE],
              "generated_assets":"all",
              "resolution":[W,H],
              "fps":FPS,
              "duration":DURATION,
              "segments":len(segments),
              "lip_sync":LIP_SYNC,
              "character":{
                  "gender":CHARACTER_GENDER,
                  "skin_tone":SKIN_TONE,"hair_style":HAIR_STYLE,
                  "beard_style":BEARD_STYLE,"shirt_style":SHIRT_STYLE,
                  "shirt_color":SHIRT_COLOR,"pants_color":PANTS_COLOR,
                  "shoe_color":SHOE_COLOR
              },
              "design_source":"procedural/vector drawing in podcast.py",
              "external_character_images_used":False
          }
          json.dump(report,open("character_generation_report.json","w",encoding="utf-8"),ensure_ascii=False,indent=2)
          with open(REPORT,"w",encoding="utf-8") as f:
              f.write("CODE-GENERATED CHARACTER REPORT\n")
              f.write("Required user files: audio.mp3 + timestamps.txt\n")
              f.write("No external character image assets are required.\n")
              f.write(json.dumps(report,ensure_ascii=False,indent=2))

          if PREVIEW_ONLY:
              print("Preview-only: generated character preview/report; video rendering skipped.")
              raise SystemExit(0)

          # ============================================================
          # 11) VIDEO RENDER
          # ============================================================
          cmd=["ffmpeg","-y","-i",AUDIO,"-f","lavfi","-i",f"color=c=black:s={W}x{H}:r={FPS}",
               "-t",str(DURATION),"-map","1:v","-map","0:a","-c:v","libx264",
               "-preset","veryfast","-crf","20","-pix_fmt","yuv420p",
               "-c:a","aac","-b:a","192k","-shortest","_silent.mp4"]
          # We need actual generated frames, so first create raw video pipe through ffmpeg.
          proc=subprocess.Popen(["ffmpeg","-y","-f","rawvideo","-pix_fmt","bgr24",
                                 "-s",f"{W}x{H}","-r",str(FPS),"-i","-",
                                 "-i",AUDIO,"-c:v","libx264","-preset","veryfast",
                                 "-crf","20","-pix_fmt","yuv420p","-c:a","aac",
                                 "-b:a","192k","-shortest",OUT],
                                stdin=subprocess.PIPE)

          for fi in range(int(math.ceil(DURATION*FPS))):
              t=fi/FPS
              seg=active_segment(t) or segments[-1]
              gs=gesture_state(t,seg)
              gs["blink"]=blink_at(t)
              character=draw_character(t,seg,gs)
              frame=studio_frame(t,seg,character)
              proc.stdin.write(frame.tobytes())

          proc.stdin.close()
          ret=proc.wait()
          if ret!=0:
              raise RuntimeError("FFmpeg video encoding failed")

          print("Created:",OUT)
          print("Duration:",DURATION)
          print("Segments:",len(segments))

          # ============================================================
          # 12) ANIMATION TIMELINE / DEBUG OUTPUT
          # ============================================================
          timeline=[]
          for s in segments:
              timeline.append({
                  "start":s["start"],"end":s["end"],
                  "expression":s["expression"],
                  "gesture":resolve_gesture(s),
                  "intensity":s["intensity"],
                  "camera":s["camera"],
                  "dialogue":s["text"]
              })
          json.dump(timeline,open(TIMELINE_JSON,"w",encoding="utf-8"),ensure_ascii=False,indent=2)
          print("Animation timeline written:",TIMELINE_JSON)
          PYEOF

          python podcast.py

      - name: Upload generated podcast and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: animated-bangla-podcast
          path: |
            podcast.mp4
            character_generated_preview.png
            character_generation_report.txt
            character_generation_report.json
            animation_timeline.json
            mouth.json
          if-no-files-found: warn
