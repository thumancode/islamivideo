name: Generate AppPromotion Video

on:
  workflow_dispatch:

jobs:
  build-video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install ffmpeg and fontconfig
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fontconfig

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install SolaimanLipi font system-wide
        run: |
          mkdir -p ~/.local/share/fonts
          cp src/solaimanlipi.ttf ~/.local/share/fonts/
          fc-cache -f ~/.local/share/fonts

          FONT_FAMILY=$(fc-scan --format "%{family}\n" src/solaimanlipi.ttf | head -n1 | cut -d',' -f1)
          echo "Detected font family: $FONT_FAMILY"
          fc-list | grep -i "solaiman" || echo "WARNING: font not showing in fc-list"
          echo "FONT_FAMILY=$FONT_FAMILY" >> "$GITHUB_ENV"

      - name: Generate typewriter ASS subtitles
        run: |
          cat > generate_captions.py << 'PYEOF'
          import re
          import subprocess
          import os
          import textwrap

          SRC = "src"
          TXT_PATH = os.path.join(SRC, "AppPromotion.txt")
          AUDIO_PATH = os.path.join(SRC, "AppVideo.mp3")
          ASS_PATH = "captions.ass"
          FONT_FAMILY = os.environ.get("FONT_FAMILY", "SolaimanLipi").strip() or "SolaimanLipi"

          out = subprocess.run(
              ["ffprobe", "-v", "error", "-show_entries", "format=duration",
               "-of", "default=noprint_wrappers=1:nokey=1", AUDIO_PATH],
              capture_output=True, text=True
          )
          audio_duration = float(out.stdout.strip())

          entries = []
          pattern = re.compile(r'^\[(\d+):(\d+)\]\s*(.+)$')
          with open(TXT_PATH, encoding="utf-8") as f:
              for line in f:
                  line = line.strip()
                  m = pattern.match(line)
                  if m:
                      minutes, seconds, text = m.groups()
                      start = int(minutes) * 60 + int(seconds)
                      entries.append((start, text.strip()))
          entries.sort(key=lambda e: e[0])

          def ass_time(t):
              t = max(t, 0)
              h = int(t // 3600)
              m = int((t % 3600) // 60)
              s = t % 60
              return "{}:{:02d}:{:05.2f}".format(h, m, s)

          def escape_ass(text):
              return text.replace("\\", "\\\\").replace("{", "\\{").replace("}", "\\}")

          header_template = textwrap.dedent("""\
              [Script Info]
              Title: AppPromotion Typewriter
              ScriptType: v4.00+
              PlayResX: 2160
              PlayResY: 3840
              WrapStyle: 0
              ScaledBorderAndShadow: yes

              [V4+ Styles]
              Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding
              Style: Default,{font},95,&H00000000,&H000000FF,&H00FFFFFF,&H00000000,0,0,0,0,100,100,0,0,1,0,0,2,100,100,850,1

              [Events]
              Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text
              """)
          header = header_template.format(font=FONT_FAMILY)

          lines = [header]

          for i, (start, text) in enumerate(entries):
              end = entries[i + 1][0] if i + 1 < len(entries) else audio_duration
              duration = end - start
              n = len(text)
              if n == 0 or duration <= 0:
                  continue

              char_dur = 0.055
              reveal_time = n * char_dur
              max_reveal = duration * 0.7
              if reveal_time > max_reveal and max_reveal > 0:
                  char_dur = max_reveal / n

              for k in range(1, n + 1):
                  t0 = start + (k - 1) * char_dur
                  t1 = start + k * char_dur if k < n else end
                  t1 = min(t1, end)
                  if t0 >= end:
                      break
                  sub = escape_ass(text[:k])
                  lines.append("Dialogue: 0,{},{},Default,,0,0,0,,{}\n".format(ass_time(t0), ass_time(t1), sub))

          with open(ASS_PATH, "w", encoding="utf-8") as f:
              f.writelines(lines)

          print("Font family used: {}".format(FONT_FAMILY))
          print("Audio duration: {:.2f}s, caption lines: {}".format(audio_duration, len(entries)))
          PYEOF
          python3 generate_captions.py

      - name: Render 4K vertical (2160x3840) video
        run: |
          DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 src/AppVideo.mp3)
          ffmpeg -y \
            -f lavfi -i "color=c=white:s=2160x3840:r=30:d=${DURATION}" \
            -i src/AppVideo.mp3 \
            -vf "subtitles=captions.ass:fontsdir=src" \
            -c:v libx264 -preset medium -crf 18 -pix_fmt yuv420p \
            -c:a aac -b:a 192k \
            -shortest \
            app_promotion_4k_9x16.mp4

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-promotion-video
          path: app_promotion_4k_9x16.mp4
