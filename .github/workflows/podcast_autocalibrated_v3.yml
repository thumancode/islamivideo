          ff = subprocess.Popen(cmd + ["-c:v", "libx264", "-preset", "medium", "-crf", "20", "-pix_fmt", "yuv420p", "-c:a", "aac", "-b:a", "192k", "-t", "%.3f" % (NF / FPS), OUT], stdin=subprocess.PIPE)
          prev_seg = -1
          mw = {k_: 0. for k_ in MMV}; mw["REST"] = 1.        # viseme-র ওজন (দ্রুত বদলালে মুখ ঝাঁকি খায় না)
          gesture_state = {"right": 0.0, "left": 0.0}
          for f in range(NF):
              tt = f / FPS; si = seg_at(tt)
              if si != prev_seg and si >= 0: seg_start = tt
              prev_seg = si
              tgt = segs[si]["ex"] if si >= 0 and segs[si]["ex"] in EXN else "neutral"
              for k_ in EXN: wexp[k_] += ((1.0 if k_ == tgt else 0.0) - wexp[k_]) * .28
              fr = basef.copy(); alpha_work = alpha.copy(); r0, r1, c0, c1 = EB
              roi = fr[r0:r1, c0:c1]
              for k_ in ["neutral", "happy", "angry", "surprised"]:
                  w_ = wexp[k_]
                  if w_ > .01:
                      m_ = EM[k_] * w_
                      if roi.shape != EYES[k_].shape:
                          raise RuntimeError(f"Expression ROI mismatch for {k_}: roi={roi.shape}, asset={EYES[k_].shape}, EB={EB}")
                      roi[:] = roi * (1 - m_) + EYES[k_] * m_
              b_ = blink_lvl(f)
              if b_ > 0:
                  if roi.shape != EYES["closed"].shape:
                      raise RuntimeError(f"Blink ROI mismatch: roi={roi.shape}, asset={EYES['closed'].shape}, EB={EB}")
                  m_ = EM["closed"] * b_; roi[:] = roi * (1 - m_) + EYES["closed"] * m_
              m0, m1, n0, n1 = MB
              for k_ in mw: mw[k_] += ((1. if k_ == VIS_AT[f] else 0.) - mw[k_]) * .75
              ws_ = sum(w_ for w_ in mw.values() if w_ > .02); A_ = 0.; C_ = 0.
              for k_, w_ in mw.items():
                  if w_ > .02: A_ = A_ + (w_ / ws_) * MMV[k_]; C_ = C_ + (w_ / ws_) * MMV[k_] * MOUTH[k_]
              A_ = np.clip(A_, 0.0, 1.0)
              mouth_roi = fr[m0:m1, n0:n1]
              if mouth_roi.shape != C_.shape:
                  raise RuntimeError(f"Viseme ROI mismatch: roi={mouth_roi.shape}, asset={C_.shape}, MB={MB}")
              fr[m0:m1, n0:n1] = mouth_roi * (1 - A_) + C_
              # Timestamp-driven hand/arm movement: raise, salute, salam, wave.
              phase = 0.0 if si < 0 else max(0.0, min(1.0, (tt - segs[si]["s"]) / max(.001, segs[si]["e"] - segs[si]["s"])))
              action = segs[si]["gesture"] if si >= 0 else "none"
              strength = segs[si]["intensity"] if si >= 0 else 0.0
              fr, alpha_work = apply_gesture_rig(fr, alpha_work, action, strength, phase, gesture_state)

              # শরীরের ভাষা: শ্বাস, বলার সময় মাথা দোলা, প্রতি অংশের শুরুতে নড
              nod = 0.
              if si >= 0 and tt - seg_start < .45: nod = math.sin(math.pi * (tt - seg_start) / .45)
              dy = 3.5 * math.sin(tt * 1.9) + 9 * env[f] * math.sin(tt * 6.3 + 1) * .4 + 12 * nod
              tilt = 1.0 * math.sin(tt * 1.15) + 1.2 * env[f] * math.sin(tt * 3.1)
              p = cv2.resize(bend(np.dstack([fr, alpha_work]), tilt, dy), (PW, PH), interpolation=cv2.INTER_AREA)
              cv = bgS.copy()
              # ধুলিকণা
              for (dx0, dy0, sz, ph) in dust:
                  px = dx0 + 12 * math.sin(tt * .4 + ph); py = (dy0 - tt * 6 * sz) % 560 + 20; cv2.circle(cv, (int(px), int(py)), 1, (200, 230, 255), -1, cv2.LINE_AA) if sz > .45 else cv2.circle(cv, (int(px), int(py)), 1, (120, 150, 170), -1)
              # ক্যারেক্টার
              put(cv, p[..., :3], p[..., 3:4], PX0, PY0)
              # নিয়ন ও ON AIR (ঝিকমিক)
              k_n = fl[f]; put(cv, N_RGB, N_A, NX0, NY0, 1); reg = cv[NY0:NY0 + NH, NX0:NX0 + NW]; reg += N_GL * (.9 * k_n)
              pulse = .65 + .35 * math.sin(tt * 2.4) ** 2 + .25 * env[f]; put(cv, A_RGB, A_A, OX0, OY0, 1); reg2 = cv[OY0:OY0 + OH, OX0:OX0 + OW]; reg2 += A_GL * pulse
              # ইকুয়ালাইজার
              ex0, ey0, ew, eh = 972, 282, 256, 156; roi_e = cv[ey0:ey0 + eh, ex0:ex0 + ew]; layer = np.zeros_like(roi_e); bw = ew / NB
              for j in range(NB):
                  hh = int(6 + spec[f, j] * (eh - 12)); x_a = int(j * bw + 1); col = (int(255 - 200 * j / NB), int(120 + 110 * spec[f, j]), int(90 + 160 * j / NB))
                  cv2.rectangle(layer, (x_a, eh - hh), (int(x_a + bw - 3), eh), col, -1)
              roi_e += layer * .95 + cv2.GaussianBlur(layer, (0, 0), 5) * .7
              # ডেস্ক/মাইক/মগ
              put(cv, FG, FGa, 0, 0)
              # মগের ধোঁয়া
              ov = np.zeros((90, 60, 3), np.float32)
              for kk in range(3):
                  pts = np.array([[int(30 + (kk - 1) * 12 + 7 * math.sin(tt * 2 + yv / 11 + kk * 2)), 88 - yv] for yv in range(0, 86, 4)], np.int32)
                  cv2.polylines(ov, [pts.reshape(-1, 1, 2)], False, (235, 235, 240), 3, cv2.LINE_AA)
              ov = cv2.GaussianBlur(ov, (0, 0), 2.2); sy, sx = 455, 848; reg3 = cv[sy:sy + 90, sx:sx + 60]; reg3 += ov * .55
              # Camera motion: global slow zoom + optional per-timestamp override.
              cam_mode = segs[si]["camera"] if si >= 0 else "default"
              if cam_mode == "static":
                  z = 1.0
              elif cam_mode == "push_in":
                  z = 1.0 + .055 * (phase if si >= 0 else 0.0)
              elif cam_mode == "pull_out":
                  z = 1.055 - .055 * (phase if si >= 0 else 0.0)
              else:
                  z = 1.0 + .035 * (tt / max(dur, 1))
              Mz = np.array([[z, 0, (1 - z) * 640], [0, z, (1 - z) * 330]], np.float32)
              out = cv2.warpAffine(np.clip(cv, 0, 255).astype(np.uint8), Mz, (W, H), flags=cv2.INTER_LINEAR, borderMode=cv2.BORDER_REPLICATE).astype(np.float32)
              put(out, T_RGB, T_A, 34, 26)
              if si >= 0:
                  rgb, a = CAPS[si]; k_c = min(1., (tt - segs[si]["s"] + .15) / .15, (segs[si]["e"] + .25 - tt) / .15 + .0) if True else 1.
                  put(out, rgb, a, (W - a.shape[1]) // 2, 712 - a.shape[0], max(0., min(1., k_c)))
              ff.stdin.write(np.clip(out, 0, 255).astype(np.uint8).tobytes())
          ff.stdin.close(); ff.wait(); print("তৈরি হয়েছে:", OUT)
          PYEOF
          python podcast.py

      - uses: actions/upload-artifact@v4
        with:
          name: podcast-video
          path: |
            podcast.mp4
            timestamps.txt
            gesture_timeline.txt
            calibration_report.txt
            calibration.json
            calibration_preview.png
