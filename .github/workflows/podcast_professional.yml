name: Animated Bangla Podcast

# Repo-র root-এ এই ফাইলগুলো রাখুন:
#   body.jpg         -> ক্যারেক্টারের full body ছবি
#   visemes.jpg      -> Viseme mouth chart
#   expressions.jpg  -> Expression / eye-blink chart
#   audio.mp3        -> আপনার পডকাস্টের ভয়েস (না থাকলে ডেমো বাংলা অডিও বানানো হবে)
#   timestamps.txt   -> প্রতি লাইনে: শুরু | শেষ | সংলাপ | expression
#   bgm.mp3          -> (ঐচ্ছিক) ব্যাকগ্রাউন্ড মিউজিক, ১০% ভলিউমে মিশবে
on:
  workflow_dispatch:
    inputs:
      podcast_name:
        description: "নিয়ন সাইনে Podcast name"
        required: true
        default: "আমার পডকাস্ট"
      episode:
        description: "উপরের বাঁ কোণের Episode tag"
        required: true
        default: "পর্ব ০১ | স্বাগতম"
      recognizer:
        description: "Rhubarb recognizer: phonetic বা pocketSphinx"
        required: true
        default: "phonetic"
      mouth_scale:
        description: "Viseme mouth scale: 1.0=স্বাভাবিক"
        required: true
        default: "0.78"
      head_match:
        description: "Expression chart head calibration: auto/manual/off"
        required: true
        default: "auto"
      auto_measure:
        description: "নতুন chart এ MV/ME auto re-measure করবে"
        required: true
        default: "true"
      auto_gesture:
        description: "Dialogue/timestamp থেকে gesture keyword ধরবে"
        required: true
        default: "true"
      gesture_smooth:
        description: "Hand gesture smoothing 0.05-0.50"
        required: true
        default: "0.20"
      gesture_max_deg:
        description: "Raised arm maximum rotation degree"
        required: true
        default: "68"
      gesture_file:
        description: "আলাদা gesture timeline চাইলে file name"
        required: true
        default: "timestamps.txt"
  push:
    branches: [main]

env:
  # workflow_dispatch থেকে edit করা যায়; push হলে এগুলো default হবে
  PODCAST_NAME: ${{ github.event.inputs.podcast_name || 'আমার পডকাস্ট' }}
  EPISODE: ${{ github.event.inputs.episode || 'পর্ব ০১ | স্বাগতম' }}
  RECOGNIZER: ${{ github.event.inputs.recognizer || 'phonetic' }}
  MOUTH_SCALE: ${{ github.event.inputs.mouth_scale || '0.78' }}

  # ========================= PROFESSIONAL CALIBRATION =========================
  AUTO_MEASURE: ${{ github.event.inputs.auto_measure || 'true' }}
  HEAD_MATCH: ${{ github.event.inputs.head_match || 'auto' }}
  AUTO_GESTURE: ${{ github.event.inputs.auto_gesture || 'true' }}
  GESTURE_SMOOTH: ${{ github.event.inputs.gesture_smooth || '0.20' }}
  GESTURE_MAX_DEG: ${{ github.event.inputs.gesture_max_deg || '68' }}
  GESTURE_FILE: ${{ github.event.inputs.gesture_file || 'timestamps.txt' }}

  # নতুন body/expressions chart দিলে target box দরকার হলে এখান থেকে edit করুন।
  # format: x0,y0,x1,y1 — original body.jpg coordinate
  BODY_HEAD_BOX: "389,72,895,500"
  BODY_EYE_BOX: "490,292,792,428"
  BODY_MOUTH_BOX: "520,437,760,593"

  # Character-right = ছবির LEFT arm, Character-left = ছবির RIGHT arm.
  # format: x0,y0,x1,y1 — original body.jpg coordinate
  ARM_RIGHT_BOX: "275,300,455,900"
  ARM_LEFT_BOX: "825,300,1005,900"
  ARM_RIGHT_PIVOT: "390,350"
  ARM_LEFT_PIVOT: "890,350"
  ARM_MASK_WIDTH: "150"

  # timestamps.txt:
  # start | end | dialogue | expression | gesture | intensity | camera | notes
  # gesture examples:
  # none
  # right:raise / left:raise / both:raise
  # right:salute / left:salute
  # right:salam / left:salam
  # right:wave / left:wave / both:wave
  # nod / bow
  #
  # gesture অংশে "auto" দিলে dialogue-এর keyword থেকেও gesture নেওয়া হবে।

jobs:
  animate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng unzip fonts-noto-core fonts-dejavu-core libraqm0 libfribidi0 libharfbuzz0b
          pip install pillow numpy opencv-python-headless gTTS fonttools

      - name: Download Rhubarb Lip Sync
        run: |
          curl -sL -o rhubarb.zip https://github.com/DanielSWolf/rhubarb-lip-sync/releases/download/v1.13.0/Rhubarb-Lip-Sync-1.13.0-Linux.zip
          unzip -q rhubarb.zip

      - name: Render podcast video
        run: |
          cat > podcast.py <<'PYEOF'
          import os, glob, json, math, random, re, shutil, subprocess, unicodedata, wave
          import numpy as np, cv2
          from PIL import Image, ImageDraw, ImageFont
          from fontTools.ttLib import TTFont

          # ============================== সেটিংস (yml-এর env থেকে আসে) ==============================
          PODCAST_NAME = os.environ.get("PODCAST_NAME", "আমার পডকাস্ট")
          EPISODE      = os.environ.get("EPISODE", "পর্ব ০১ | স্বাগতম")
          AUDIO        = os.environ.get("AUDIO", "audio.mp3")
          TIMESTAMPS   = os.environ.get("GESTURE_FILE", os.environ.get("TIMESTAMPS", "timestamps.txt"))
          BGM          = os.environ.get("BGM", "bgm.mp3")            # ঐচ্ছিক ব্যাকগ্রাউন্ড মিউজিক
          RECOGNIZER   = os.environ.get("RECOGNIZER", "phonetic")    # বাংলা/অন্য ভাষা: phonetic | ইংরেজি: pocketSphinx
          OUT          = os.environ.get("OUT", "podcast.mp4")
          MOUTH_SCALE  = float(os.environ.get("MOUTH_SCALE", "0.78"))   # মুখ কতটা ছোট দেখাবে (১.০ = আগের মতো, কম = ছোট)
          AUTO_MEASURE = os.environ.get("AUTO_MEASURE", "true").lower() == "true"
          HEAD_MATCH = os.environ.get("HEAD_MATCH", "auto").lower()
          AUTO_GESTURE = os.environ.get("AUTO_GESTURE", "true").lower() == "true"
          GESTURE_SMOOTH = float(os.environ.get("GESTURE_SMOOTH", "0.20"))
          GESTURE_MAX_DEG = float(os.environ.get("GESTURE_MAX_DEG", "68"))
          GESTURE_FILE = os.environ.get("GESTURE_FILE", TIMESTAMPS)
          BODY_HEAD_BOX = tuple(map(int, os.environ.get("BODY_HEAD_BOX", "389,72,895,500").split(",")))
          BODY_EYE_BOX = tuple(map(int, os.environ.get("BODY_EYE_BOX", "490,292,792,428").split(",")))
          BODY_MOUTH_BOX = tuple(map(int, os.environ.get("BODY_MOUTH_BOX", "520,437,760,593").split(",")))
          ARM_RIGHT_BOX = tuple(map(int, os.environ.get("ARM_RIGHT_BOX", "275,300,455,900").split(",")))
          ARM_LEFT_BOX = tuple(map(int, os.environ.get("ARM_LEFT_BOX", "825,300,1005,900").split(",")))
          ARM_RIGHT_PIVOT = tuple(map(int, os.environ.get("ARM_RIGHT_PIVOT", "390,350").split(",")))
          ARM_LEFT_PIVOT = tuple(map(int, os.environ.get("ARM_LEFT_PIVOT", "890,350").split(",")))
          ARM_MASK_WIDTH = int(os.environ.get("ARM_MASK_WIDTH", "150"))
          W, H, FPS = 1280, 720, 24

          # ============================== ১) অডিও (না থাকলে ডেমো বাংলা অডিও বানায়) ==============================
          DEMO = [
              ("আসসালামু আলাইকুম! আমার পডকাস্টে আপনাকে স্বাগতম।", "happy"),
              ("আজকের বিষয় হলো, একজন অ্যান্ড্রয়েড ডেভেলপার কীভাবে অ্যানিমেশন দিয়ে আয় করতে পারে।", "neutral"),
              ("এটা শুনে অনেকেই অবাক হন, কিন্তু এটা সম্ভব!", "surprised"),
              ("তবে ধৈর্য আর নিয়মিত কাজ ছাড়া সফলতা আসে না।", "angry"),
              ("চলুন, শুরু করা যাক!", "happy"),
          ]
          def make_demo():
              SR = 22050; parts = [np.zeros(int(SR * .6), np.int16)]; t = .6; rows = []
              for i, (txt, ex) in enumerate(DEMO):
                  try:
                      from gtts import gTTS
                      gTTS(txt, lang="bn").save("d.mp3")
                      subprocess.run(["ffmpeg", "-y", "-loglevel", "error", "-i", "d.mp3", "-ar", str(SR), "-ac", "1", f"d{i}.wav"], check=True)
                  except Exception as e:
                      print("gTTS নেই -> espeak-ng (bn):", e)
                      subprocess.run(["espeak-ng", "-v", "bn", "-s", "135", "-w", f"r{i}.wav", txt], check=True)
                      subprocess.run(["ffmpeg", "-y", "-loglevel", "error", "-i", f"r{i}.wav", "-ar", str(SR), "-ac", "1", f"d{i}.wav"], check=True)
                  with wave.open(f"d{i}.wav") as w: a = np.frombuffer(w.readframes(w.getnframes()), np.int16)
                  d = len(a) / SR; rows.append(f"{t:.2f} | {t + d:.2f} | {txt} | {ex}")
                  parts += [a, np.zeros(int(SR * .5), np.int16)]; t += d + .5
              with wave.open("demo.wav", "wb") as w:
                  w.setnchannels(1); w.setsampwidth(2); w.setframerate(SR); w.writeframes(np.concatenate(parts).tobytes())
              subprocess.run(["ffmpeg", "-y", "-loglevel", "error", "-i", "demo.wav", AUDIO], check=True)
              open(TIMESTAMPS, "w", encoding="utf-8").write("# শুরু | শেষ | সংলাপ | expression (neutral/happy/angry/surprised)\n" + "\n".join(rows) + "\n")
          if not os.path.exists(AUDIO):
              print("audio.mp3 পাওয়া যায়নি -> ডেমো বানানো হচ্ছে"); make_demo()

          subprocess.run(["ffmpeg", "-y", "-loglevel", "error", "-i", AUDIO, "-ar", "22050", "-ac", "1", "voice.wav"], check=True)
          SR = 22050
          with wave.open("voice.wav") as w: audio = np.frombuffer(w.readframes(w.getnframes()), np.int16)
          dur = len(audio) / SR; NF = int((dur + 0.6) * FPS) + 1

          def tsec(s):
              v = 0.0
              for x in s.strip().split(":"): v = v * 60 + float(x)
              return v
          # timestamps.txt-এ যেকোনো নাম দিতে পারেন; নিচের নামগুলো ৪টি মূল expression-এ মিলিয়ে নেওয়া হয়
          EX_ALIAS = {"respectful": "neutral", "calm": "neutral", "informative": "neutral", "serious": "neutral", "sad": "neutral",
                      "excited": "happy", "enthusiastic": "happy", "joy": "happy", "smile": "happy",
                      "irritated": "angry", "shocked": "surprised", "surprise": "surprised"}

          # Timestamp format:
          # start | end | dialogue | expression | gesture | intensity | camera | notes
          # পুরনো 4-column format-ও পুরোপুরি কাজ করবে।
          GESTURE_ALIAS = {
              "none": "none", "rest": "none", "idle": "none",
              "raise": "right:raise", "hand_up": "right:raise", "handup": "right:raise",
              "salute": "right:salute", "salam": "right:salam", "wave": "right:wave",
              "right_raise": "right:raise", "left_raise": "left:raise", "both_raise": "both:raise",
              "right_salute": "right:salute", "left_salute": "left:salute",
              "right_salam": "right:salam", "left_salam": "left:salam",
              "right_wave": "right:wave", "left_wave": "left:wave", "both_wave": "both:wave",
              "nod": "nod", "bow": "bow"
          }

          def infer_gesture(text):
              if not AUTO_GESTURE: return "none"
              t = re.sub(r"\s+", " ", text.lower())
              side = "both" if ("দুই হাত" in t or "উভয় হাত" in t or "উভয় হাত" in t or "both hand" in t) else                      "right" if ("ডান হাত" in t or "right hand" in t) else                      "left" if ("বাম হাত" in t or "বাঁ হাত" in t or "left hand" in t) else "right"
              if any(k in t for k in ["স্যালুট", "salute"]):
                  return side + ":salute"
              # "আসসালামু আলাইকুম" যেন ভুল করে hand gesture না চালায়।
              if any(k in t for k in ["হাত দিয়ে সালাম", "হাত দিয়ে সালাম", "সালাম দিব", "সালাম দেবে", "সালাম দিচ্ছে", "সালাম করুন", "salam gesture"]):
                  return side + ":salam"
              if any(k in t for k in ["হাত নাড়", "হাত নাড়", "হাত নেড়ে", "হাত নেড়ে", "wave hand", "wave"]):
                  return side + ":wave"
              if any(k in t for k in ["হাত উঠ", "হাত তুল", "হাত তোলে", "হাত তুলবে", "raise hand", "hand up"]):
                  return side + ":raise"
              if "মাথা নাড়" in t or "মাথা নাড়" in t or "nod" in t:
                  return "nod"
              if "ঝুঁকে" in t or "নতমস্তক" in t or "bow" in t:
                  return "bow"
              return "none"

          def normalize_gesture(raw, text):
              raw = (raw or "").strip().lower()
              if not raw or raw == "auto":
                  return infer_gesture(text)
              raw = raw.replace(" ", "_")
              if raw in GESTURE_ALIAS: return GESTURE_ALIAS[raw]
              # Accept: right:raise, left:salute, both:wave, nod, bow
              return raw

          segs = []
          if os.path.exists(TIMESTAMPS):
              for ln in open(TIMESTAMPS, encoding="utf-8-sig"):
                  ln = ln.strip()
                  if not ln or ln.startswith("#"): continue
                  p = [x.strip() for x in ln.split("|")]
                  if len(p) < 3: continue
                  ex = EX_ALIAS.get(p[3].lower(), p[3].lower()) if len(p) > 3 and p[3] else "neutral"
                  try: intensity = max(0.0, min(1.0, float(p[5]))) if len(p) > 5 and p[5] else 1.0
                  except Exception: intensity = 1.0
                  segs.append(dict(
                      s=tsec(p[0]), e=tsec(p[1]), text=p[2], ex=ex,
                      gesture=normalize_gesture(p[4] if len(p) > 4 else "auto", p[2]),
                      intensity=intensity,
                      camera=(p[6].lower() if len(p) > 6 and p[6] else "default"),
                      notes=(p[7] if len(p) > 7 else "")
                  ))
          print("সংলাপের অংশ:", len(segs), "| অডিও দৈর্ঘ্য: %.1fs" % dur)
          print("Gesture timeline:", [(round(s["s"],2), round(s["e"],2), s["gesture"], s["intensity"]) for s in segs])
          with open("gesture_timeline.txt", "w", encoding="utf-8") as _gf:
              _gf.write("# start | end | gesture | intensity | dialogue\n")
              for _s in segs:
                  _gf.write(f"{_s['s']:.2f} | {_s['e']:.2f} | {_s['gesture']} | {_s['intensity']:.2f} | {_s['text']}\n")

          # ============================== ২) Lip-sync cues (Rhubarb) ==============================
          cues = None
          rb = shutil.which("rhubarb") or next(iter(glob.glob("Rhubarb*/rhubarb")), None)
          if rb:
              try:
                  r = subprocess.run([rb, "-q", "-f", "json", "-r", RECOGNIZER, "voice.wav"], capture_output=True, text=True, check=True)
                  cues = json.loads(r.stdout)["mouthCues"]
              except Exception as e: print("rhubarb ব্যর্থ:", e)
          x_ = audio.astype(np.float32) / 32768; hop = SR // FPS
          lv = np.array([np.sqrt(np.mean(x_[i*hop:(i+1)*hop] ** 2) + 1e-9) if len(x_[i*hop:(i+1)*hop]) else 1e-4 for i in range(NF)]); lv = lv / (np.percentile(lv, 92) + 1e-6)
          if cues is None:
              cues = [{"start": i / FPS, "end": (i + 1) / FPS, "value": "X" if v < .12 else "B" if v < .4 else "C" if v < .75 else "D"} for i, v in enumerate(lv)]
          MAP = {"A": "M", "B": "I", "C": "E", "D": "A", "E": "O", "F": "U", "G": "F", "H": "L", "X": "REST"}
          VIS_AT, k = [], 0
          for f in range(NF):
              tt = f / FPS + .02
              while k < len(cues) - 1 and cues[k]["end"] <= tt: k += 1
              VIS_AT.append(MAP[cues[k]["value"]] if cues[k]["start"] <= tt < cues[k]["end"] else "REST")
          env, e_ = np.zeros(NF), 0.0
          for i, v in enumerate(np.clip(lv, 0, 1.3)): e_ += (v - e_) * (.5 if v > e_ else .2); env[i] = e_

          # audio spectrum for the equalizer wall-screen
          NB = 26; edges = np.geomspace(90, 7500, NB + 1); spec = np.zeros((NF, NB), np.float32); fr_ax = np.fft.rfftfreq(2048, 1 / SR); hann = np.hanning(2048)
          xp = np.pad(x_, (1024, 1024 + 4096 + SR))
          for i in range(NF):
              c = int(i / FPS * SR); m = np.abs(np.fft.rfft(xp[c:c + 2048] * hann))
              spec[i] = [m[(fr_ax >= edges[j]) & (fr_ax < edges[j + 1])].mean() if ((fr_ax >= edges[j]) & (fr_ax < edges[j + 1])).any() else 0 for j in range(NB)]
          spec = np.log1p(spec * 40); spec /= (np.percentile(spec, 97) + 1e-6)
          for i in range(1, NF): spec[i] = np.maximum(spec[i], spec[i - 1] * .8)      # smooth decay
          spec = np.clip(spec, 0, 1)

          # ============================== ৩) ক্যারেক্টার লেয়ার ==============================
          body = cv2.imread("body.jpg"); vis = cv2.imread("visemes.jpg"); expr = cv2.imread("expressions.jpg")
          _n, _lab = cv2.connectedComponents((body.min(axis=2) > 226).astype(np.uint8))
          _edge = set(np.unique(np.concatenate([_lab[0], _lab[:, 0], _lab[:, -1]]))) - {0}
          bgm_ = np.isin(_lab, list(_edge))
          _n2, _lab2, _st, _cen = cv2.connectedComponentsWithStats((body.min(axis=2) > 226).astype(np.uint8))
          for _i in range(1, _n2):     # মাথার উপরের ছোট বিচ্ছিন্ন সাদা দাগ (চুলের ফাঁক) ব্যাকগ্রাউন্ড ধরা হবে
              if _i not in _edge and _st[_i, 4] < 500 and _cen[_i][1] < 330 and 430 < _cen[_i][0] < 850: bgm_ |= (_lab2 == _i)
          body[bgm_] = 255
          CX0, CY0, CX1, CY1 = 100, 20, 1180, 980; CW, CH = CX1 - CX0, CY1 - CY0     # কাঁধ ও বাহু সম্পূর্ণ দেখাতে চওড়া crop (আগে 240-1040 ছিল)
          base = body[CY0:CY1, CX0:CX1].copy(); pm = (~bgm_[CY0:CY1, CX0:CX1]).astype(np.uint8)
          # কিনারার সাদা আভা (halo) সরানো
          band = (cv2.dilate(pm, np.ones((9, 9), np.uint8)) & ~cv2.erode(pm, np.ones((5, 5), np.uint8))) > 0
          base = cv2.inpaint(base, band.astype(np.uint8) * 255, 3, cv2.INPAINT_TELEA)
          alpha = cv2.GaussianBlur(pm.astype(np.float32), (0, 0), .8)
          # ============================== ৩A) 2D arm/hand gesture rig ==============================
          # Character-right = source image-এর LEFT arm; Character-left = source image-এর RIGHT arm.
          # Gesture is timestamp-driven, smooth, and independently editable.
          def _crop_pt(pt):
              return (int(pt[0] - CX0), int(pt[1] - CY0))

          def _arm_mask(side):
              box = ARM_RIGHT_BOX if side == "right" else ARM_LEFT_BOX
              piv = ARM_RIGHT_PIVOT if side == "right" else ARM_LEFT_PIVOT
              x0, y0, x1, y1 = box
              px, py = _crop_pt(piv)
              wx, wy = _crop_pt(((x0 + x1) / 2, y1 - 45))
              m = np.zeros((CH, CW), np.uint8)
              cv2.line(m, (px, py), (wx, wy), 255, ARM_MASK_WIDTH, cv2.LINE_AA)
              cv2.ellipse(m, (wx, wy), (ARM_MASK_WIDTH // 2 + 8, ARM_MASK_WIDTH // 2 + 8), 0, 0, 360, 255, -1)
              # Keep the mask inside the configured arm box.
              clip = np.zeros_like(m); cv2.rectangle(clip, (x0-CX0, y0-CY0), (x1-CX0, y1-CY0), 255, -1)
              m = cv2.bitwise_and(m, clip)
